# Steady-state batch size on the L4 (paper methodology, 2026-11-19): every model x GPU pair is compared at
# its own steady-state batch B* = the smallest B with kernel_busy >= 0.95 whose decisions/s gain to the next B
# is < 5%. This config covers the L4's "largest model that fits" candidates that have no batch sweep yet; the
# fourth one, qwen3-8b.zeroshot, was swept by configs/batch_sweep_ref.toml (record 20261109-231713-a38ec98c).
# Everything that affects numbers matches batch_sweep_ref.toml (same pool, seed, tokenizer, grid, warm-up,
# trace), so the four L4 rows are comparable; only the model list changes.
# Loaded weights on the L4 (roofline records): qwen35-9b ~17.4 GB, jevk5-9b ~17.6 GB, lfm2-8b-a1b ~17.3 GB of
# 23 GB, so B >= 16-32 at 1024 tokens will likely run out of memory (qwen3-8b did at B = 32, 64). A point that
# does is recorded as batch_s<L>_b<B>_oom = 1 and the sweep goes on. The L4 saturates by B = 4-8 for every
# model swept so far, so the grid stops at 64.
# Not here: elephant-1 and d1-3b, whose backends have no decide_batch (they cannot run the batch benchmark).
# First batch > 1 run of Qwen3.5 (Gated DeltaNet) and LFM2 (short conv + MoE) through semif's left-padded
# batch: decide_batch skips the softmax and checks no answers, so a padding bug would not fail the run.
# Estimate: ~11-15 min per model (qwen3-8b on L4: 666 s), ~45 min in all, one L4 container: ~$1 on Modal.
#   uv run --group modal s1 submit configs/steady_state_batch_l4.toml
benchmarks = ["batch"]

[launch]
orchestrator = "modal"
gpu = "L4"
gpus = 1
cpus = 8
mem = "28G"
time = "02:00:00"

[invariants]
gpu_metrics = "detailed"
gpu_metrics_schema = 1
gpu = "auto"
require_gpu = "L4"
dtype = "bfloat16"
measure_ceilings = true
max_prompt_tokens = 16384
semif_max_options = 16

[params]
batch_seed = 0
batch_pool = 64
batch_min_decisions = 32
batch_min_batches = 4
batch_trace = 2
batch_warmup = 8
batch_max_options = 16
batch_max_question_tokens = 512
batch_tokenizer_file = "$MODELS_DIR/Qwen3.5-4B-Base/tokenizer.json"

[sweep]
model = ["lfm2-8b-a1b.zeroshot", "qwen35-9b.zeroshot", "jevk5-9b"]  # Liquid's model first (call on 11-24)

[grid]
batch_state_tokens = [128, 1024]
batch_sizes = [1, 2, 4, 8, 16, 32, 64]
