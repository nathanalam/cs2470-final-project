# Multimodal experiment C (docs/multimodal.md): d1-3B with a picture in the state vs text filler of the same
# LM length vs no picture, at image sizes 384 / 768 / 1024 px (3:2) and B = 1..64, on an L4 (edge-class) and
# an H100. Each series' steady-state batch is picked by the project's rule (kernel_busy >= 0.95, not beaten
# by 5%), and the arms are compared there. The packed path is checked against the engine's own answers first.
# Estimate: ~40 min on the L4, ~15 min on the H100; about $2.
#   uv run --group modal s1 submit configs/vl_batch_d1.toml               (both GPUs)
#   uv run --group modal s1 submit configs/vl_batch_d1.toml --gpu H100    (one of them)
benchmarks = ["vl_batch"]

[launch]
orchestrator = "modal"
gpu = ["L4", "H100"]  # require_gpu is set per GPU by the launcher
gpus = 1
cpus = 8
mem = "28G"
time = "01:30:00"

[invariants]
gpu_metrics = "detailed"
gpu_metrics_schema = 1
gpu = "auto"
dtype = "bfloat16"
max_prompt_tokens = 16384

[params]
model = "d1-3b.eager"
vl_batch_arms = "image,text,none"
vl_batch_tokenizer_file = "$MODELS_DIR/d1-3B/tokenizer.json"
vl_batch_seed = 0
vl_batch_pool = 64
vl_batch_min_decisions = 32
vl_batch_min_batches = 4
vl_batch_trace = 2
vl_batch_check = true
vl_batch_check_rows = 8

[grid]
vl_batch_image_px = [384, 768, 1024]
vl_batch_sizes = [1, 2, 4, 8, 16, 32, 64]
