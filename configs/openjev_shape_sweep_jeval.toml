# JEVal-state variant of configs/openjev_shape_sweep_cache.toml: identical grid, cache on/off sweep and
# settings, except that states and questions are REAL JEVal text (shape_state_source = "jeval") instead of
# random common words. Run both under the same invariants and compare, to see what synthetic text distorts
# (tokenization, prefix-cache behaviour). The dataset is loaded inside the job by jeval.load_rows() (cached
# Hugging Face download at the pinned revision), never on the login node.
#
# What differs from the synthetic run besides the text: the Q questions are Q real JEVal questions (choice
# and noul), unrelated to the cut state, drawn per request, and the record gets
# shape_sweep_t{T}_q{Q}_shared_prefix_tokens (tokens a request shares with an earlier one: real JEVal
# sources start with the same text, so a prefix cache can hit although every state differs).
#
# --- original header of the synthetic config, still true here ---
# Cache-aware request-shape sweep (follow-up to the first shape_sweep run, job 4059).
#
# That run repeated identical requests, so vLLM's prefix cache answered every repetition after the first.
# vLLM caches this hybrid (Gated DeltaNet) model's prompts in blocks of 784 tokens, so prompts below 784
# tokens can never hit the cache, and longer ones only in whole blocks (see AGENTS.md).
#
# Here every repetition uses a fresh state (shape_unique_states), state length is counted with one real
# reference tokenizer (Qwen's, from the model directory), and the run is repeated with the cache on and off.
#
# Grid: T is STATE tokens; the prompt adds ~80 tokens (chat template + one question), so the 784 and 1568
# block boundaries fall near T = 705 and T = 1489. 640/720 and 1400/1500 sit on either side of them.
# 7 x 4 points; each point runs >= 5 s. Two runs (cache on, cache off) = two model loads (~15-20 min each),
# so ask for 2 h:
#   uv run s1 submit configs/openjev_shape_sweep_jeval.toml -p gpu-parallel -g 4 -c 32 --mem 160G -t 02:00:00
benchmarks = ["shape_sweep"]

[invariants]
gpu = "auto"
tensor_parallel_size = 4
quantization = "none"
max_model_len = 16384
state_tokenizer = "file"
state_tokenizer_file = "/shared/home/$USER/models/openjev/tokenizer.json"

[params]
model = "openjev"
shape_warmup = 1
shape_min_point_s = 5.0
shape_unique_states = true
shape_state_source = "jeval"

[sweep]
prefix_caching = [true, false]

[grid]
state_tokens = [32, 256, 640, 720, 1400, 1500, 2048]
questions_per_request = [1, 4, 16, 32]
