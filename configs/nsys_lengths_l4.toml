# configs/nsys_lengths.toml on the L4, the reference GPU where the roofline binds (hypothesis E: the GPU is
# busy most of each decision even at short states, and kernels sit near the L4's roof). Capped at 8,192 state
# tokens: qwen35-9b (19.3 GB of weights) at 16k may not fit in 24 GB. Same rows as nsys_lengths.toml.
#   uv run --group modal s1 submit configs/nsys_lengths_l4.toml --nsys 8
benchmarks = ["batch"]

[launch]
orchestrator = "modal"
gpu = ["L4"]  # require_gpu is set by the launcher
gpus = 1
cpus = 8
mem = "28G"
time = "02:00:00"

[invariants]
gpu_metrics = "detailed"
gpu_metrics_schema = 1
gpu = "auto"
dtype = "bfloat16"
measure_ceilings = false
max_prompt_tokens = 20480
semif_max_options = 16
nsys_gpu_metrics = true

[params]
batch_seed = 0
batch_pool = 8
batch_warmup = 8
batch_max_options = 16
batch_max_question_tokens = 512
batch_min_state_tokens = 16384  # the same rows as nsys_lengths.toml
batch_tokenizer_file = "$MODELS_DIR/Qwen3.5-4B-Base/tokenizer.json"

[sweep]
model = ["qwen3-8b.zeroshot", "qwen35-9b.zeroshot", "lfm2-8b-a1b.zeroshot"]
batch_nsys_state_tokens = [32, 512, 2048, 4096, 8192]

[grid]
batch_state_tokens = [32, 512, 2048, 4096, 8192]
batch_sizes = [1]
