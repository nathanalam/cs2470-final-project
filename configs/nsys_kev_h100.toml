# Nsight Systems timelines (s1 nsys) of kev-4b.hybrid batch-1 decisions on an H100 at 768 and at 1,024 state
# tokens, the two sides of its 2.5-4x latency jump (results/roofline_findings.md: H100 25 -> 95 ms). If the jump
# is the end of the captured CUDA-graph shape range, the 768 timeline launches graphs (cudaGraphLaunch, few
# kernel launches) and the 1,024 one launches every kernel eagerly (batch_nsys_launches ~ batch_nsys_kernels).
# The same pool rows at both lengths (batch_nsys_state_tokens picks one of the grid's lengths); one container.
#   uv run --group modal s1 submit configs/nsys_kev_h100.toml --nsys 16
benchmarks = ["batch"]

[launch]
orchestrator = "modal"
gpu = "H100"
gpus = 1
cpus = 8
mem = "28G"
time = "00:45:00"

[invariants]
gpu_metrics = "detailed"
gpu_metrics_schema = 1
gpu = "auto"
dtype = "bfloat16"
measure_ceilings = false

[params]
model = "kev-4b.hybrid"
batch_seed = 0
batch_pool = 16
batch_warmup = 16
batch_max_options = 16
batch_max_question_tokens = 512
batch_tokenizer_file = "$MODELS_DIR/Qwen3.5-4B-Base/tokenizer.json"

[sweep]
batch_nsys_state_tokens = [768, 1024]

[grid]
batch_state_tokens = [768, 1024]
batch_sizes = [1]
