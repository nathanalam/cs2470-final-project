# ncu_lengths.toml for olmoe-1b-7b (see that file for the experiment): the most memory-bound model (64 experts,
# top-8; measured intensity 49-60 FLOP/byte at natural lengths), so the best kernel-level test of the H200's
# extra bandwidth. Stops at 4,096 state tokens: OLMoE's trained context is 4,096 (its config's
# max_position_embeddings), and at 4,096 the prompt runs a little past it, which does not change the timing.
# Same questions as ncu_lengths.toml (roofline_min_state_tokens).
# Run under ncu with N questions per length (queues `s1 ncu`; paid Modal GPU time):
#   uv run --group modal s1 submit configs/ncu_lengths_olmoe.toml --ncu 3
benchmarks = ["roofline"]

[launch]
orchestrator = "modal"
gpu = ["L4", "H100", "H200"]  # one container per GPU, run concurrently; require_gpu is set per GPU by the launcher
gpus = 1
cpus = 8
mem = "28G"
time = "02:00:00"

[invariants]
gpu_metrics = "detailed"
gpu_metrics_schema = 1
gpu = "auto"
dtype = "bfloat16"
measure_ceilings = true
max_prompt_tokens = 20480  # same as ncu_lengths.toml
semif_max_options = 16

[params]
roofline_seed = 0
roofline_max_options = 16
roofline_warmup = 4
roofline_counted = 4
roofline_per_length = 8
roofline_min_state_tokens = 16384
roofline_tokenizer_file = "$MODELS_DIR/Qwen3.5-4B-Base/tokenizer.json"

[sweep]
model = ["olmoe-1b-7b.zeroshot"]

[grid]
roofline_state_tokens = [32, 512, 2048, 4096]
