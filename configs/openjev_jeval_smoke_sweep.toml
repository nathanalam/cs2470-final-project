# M4 GPU sweep: OpenJev JEVal smoke (200 questions, 8 and 1 in flight) on every 80 GB-plus GPU, one GPU each (TP=1, bf16,
# max_model_len 16384). configs/openjev_jeval_smoke_h100.toml unchanged except the GPU list: require_gpu comes from the
# launcher, one per GPU (H100 is pinned as H100!, so Modal cannot swap in an H200). The M1 H100 records
# used basic GPU metrics; these use detailed ones.
#   uv run --group modal s1 submit configs/openjev_jeval_smoke_sweep.toml --gpu H200   (one GPU at a time)
benchmarks = ["jeval"]

[launch]
orchestrator = "modal"
gpu = ["A100-80GB", "H100", "H200", "B200"]  # the 80 GB-plus GPUs; one container each, run concurrently
gpus = 1
cpus = 8
mem = "96G"
time = "02:00:00"

[invariants]
gpu_metrics = "detailed"   # every Modal run (superset of basic); the M1/M2 records committed on 2026-11-08 were basic
gpu_metrics_schema = 1
gpu = "auto"
tensor_parallel_size = 1
quantization = "none"      # bf16, as on the A10G runs; FP8 on H100 is a separate experiment
max_model_len = 16384

[params]
model = "openjev"
jeval_limit = 200
jeval_seed = 0

[sweep]
jeval_concurrency = [8, 1]
