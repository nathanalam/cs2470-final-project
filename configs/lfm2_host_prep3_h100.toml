# LFM2-8B-A1B host prep, three ways, on one H100 container (one host CPU for all three, see the Modal host-CPU
# confound): inline (prep inside each batch's wall), pretokenized (prep before the point, out of the timer) and
# overlapped (batch i+1 prepared on a CPU thread while batch i runs, prep kept in the wall, as a server does).
# Question: does overlapped reach pretokenized's kernel_busy 0.97-0.98 (B* 32 at 128 tokens, 16 at 1024)?
# Same rows and settings as lfm2_host_prep_h100.toml, default expert dispatch only.
benchmarks = ["batch"]

[launch]
orchestrator = "modal"
gpu = "H100"
gpus = 1
cpus = 8
mem = "28G"
time = "02:00:00"

[invariants]
gpu_metrics = "detailed"
gpu_metrics_schema = 1
gpu = "auto"
require_gpu = "H100"
dtype = "bfloat16"
measure_ceilings = true
max_prompt_tokens = 16384
semif_max_options = 16

[params]
model = "lfm2-8b-a1b.zeroshot"
batch_seed = 0
batch_pool = 256
batch_min_decisions = 32
batch_min_batches = 4
batch_trace = 2
batch_warmup = 8
batch_max_options = 16
batch_max_question_tokens = 512
batch_tokenizer_file = "$MODELS_DIR/Qwen3.5-4B-Base/tokenizer.json"

[sweep]
batch_host_prep = ["inline", "pretokenized", "overlapped"]

[grid]
batch_state_tokens = [128, 1024]
batch_sizes = [1, 2, 4, 8, 16, 32, 64]
