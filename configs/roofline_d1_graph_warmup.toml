# Why is d1-3b.compiled slower than eager? configs/roofline_sweep_d1_lengths.toml on its L40S alone, with the
# warm-up list answered twice. torch's CUDA graph trees give every new input size its own graph: the 1st call at
# a size warms it up (eager, in the graph pool), the 2nd records it, only the 3rd replays. Almost every timed
# question in the sweep has a size of its own and was warmed once, so its timed call was the recording.
# With roofline_warmup_passes = 2 every timed call is a replay. If compiled now beats eager (Liquid's card:
# 8 ms vs 16 ms on an RTX 4090), the sweep's compiled numbers measured graph recording, not graphed inference.
# Eager runs in the same container so both share one host CPU.
# Then submit this config with the modal group: s1 submit configs/roofline_d1_graph_warmup.toml
benchmarks = ["roofline"]

[launch]
orchestrator = "modal"
gpu = "L40S"
gpus = 1
cpus = 8
mem = "28G"
time = "00:30:00"   # hard stop: at most half an hour of L40S

[invariants]
gpu_metrics = "detailed"
gpu_metrics_schema = 1
gpu = "auto"
require_gpu = "L40S"
dtype = "bfloat16"
measure_ceilings = true
max_prompt_tokens = 16384

[params]
roofline_limit = 200
roofline_seed = 0
roofline_max_tokens = 1024
roofline_max_options = 16
roofline_warmup = 320
roofline_warmup_passes = 2  # the only change from the sweep: each size's timed call is its 3rd, a replay
roofline_counted = 8
roofline_per_length = 40
roofline_tokenizer_file = "$MODELS_DIR/Qwen3.5-4B-Base/tokenizer.json"

[sweep]
model = ["d1-3b.eager", "d1-3b.compiled"]

[grid]
roofline_state_tokens = [32, 128, 256, 512, 768, 1024, 1536, 2048]
