# Optional, for the Liquid AI call (2026-11-24): steady-state batch size of lfm2-8b-a1b.zeroshot (MoE, ~1.4B
# active of 8.3B) on the four big GPUs. Not a "largest model that fits" pair (that is OpenJev on these GPUs,
# configs/steady_state_openjev.toml); it extends the L4 row of configs/steady_state_batch_l4.toml. An MoE reads
# more distinct experts as B grows, so it should need a larger batch than dense qwen3-8b (B* = 4 on H100/H200/
# B200), and the grid runs to 256.
# Same settings as configs/batch_sweep_ref.toml except batch_pool = 256 (it must cover the largest B). The pool
# for 256 starts with the same 64 rows as the 64-row pool (roofline.spread is a prefix), so B = 1-16 run on
# the same rows as every earlier sweep; B = 32 and 64 draw rows 64-255 where the 64-row pool wrapped around.
# At least 771 JEVal rows qualify (state >= 1024 words, so >= 1024 tokens), enough for 256.
# 256 x ~1.4k tokens at 1024 may run out of memory on the 80 GB cards; that point is recorded as _oom = 1.
# Estimate: ~15-25 min per GPU (qwen3-8b to B = 64 took 3-6 min; B = 128 and 256 add ~4x the tokens), about
# 1.3 GPU-hours, roughly $5-6 on Modal.
#   uv run --group modal s1 submit configs/steady_state_batch_lfm2.toml               (all four GPUs)
#   uv run --group modal s1 submit configs/steady_state_batch_lfm2.toml --gpu H100    (one of them)
benchmarks = ["batch"]

[launch]
orchestrator = "modal"
gpu = ["A100-80GB", "H100", "H200", "B200"]  # require_gpu is set per GPU by the launcher
gpus = 1
cpus = 8
mem = "28G"
time = "02:00:00"

[invariants]
gpu_metrics = "detailed"
gpu_metrics_schema = 1
gpu = "auto"
dtype = "bfloat16"
measure_ceilings = true
max_prompt_tokens = 16384
semif_max_options = 16

[params]
model = "lfm2-8b-a1b.zeroshot"
batch_seed = 0
batch_pool = 256
batch_min_decisions = 32
batch_min_batches = 4
batch_trace = 2
batch_warmup = 8
batch_max_options = 16
batch_max_question_tokens = 512
batch_tokenizer_file = "$MODELS_DIR/Qwen3.5-4B-Base/tokenizer.json"

[grid]
batch_state_tokens = [128, 1024]
batch_sizes = [1, 2, 4, 8, 16, 32, 64, 128, 256]
