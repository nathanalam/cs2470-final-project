# M1 baseline: the cache-aware request-shape sweep (configs/openjev_shape_sweep_cache.toml) on ONE H100 instead of
# 4x A10G. Same grid, same fresh-state repetitions, same reference tokenizer (the model's own, now on the Modal
# models volume), cache on and off. Only the GPU, the split and the tokenizer path change.
#   uv run --group modal s1 submit configs/openjev_shape_sweep_cache_h100.toml
benchmarks = ["shape_sweep"]

[launch]
orchestrator = "modal"
gpu = "H100"
gpus = 1
cpus = 8
mem = "96G"
time = "02:30:00"

[invariants]
gpu = "auto"
require_gpu = "H100"
tensor_parallel_size = 1
quantization = "none"
max_model_len = 16384
state_tokenizer = "file"
state_tokenizer_file = "/models/openjev/tokenizer.json"

[params]
model = "openjev"
shape_warmup = 1
shape_min_point_s = 5.0
shape_unique_states = true

[sweep]
prefix_caching = [true, false]

[grid]
state_tokens = [32, 256, 640, 720, 1400, 1500, 2048]
questions_per_request = [1, 4, 16, 32]
