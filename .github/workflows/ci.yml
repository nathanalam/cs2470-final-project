# CI: the same gate AGENTS.md asks for locally, plus a check that the generated results report is in sync.
#
#   * Light install only: `uv sync` (core deps + dev group). The `openjev` extra (vllm, torch) is never
#     installed here; there is no GPU, no secrets, no model download and no Hub access. Only dependency
#     installs touch the network.
#   * Report sync: results/REPORT.md and results/report.html are generated by `uv run s1 report`. The
#     pre-commit hook (scripts/hooks/pre-commit) regenerates them, but a commit made with --no-verify or
#     without core.hooksPath set can leave them stale. Regenerating and running `git diff --exit-code`
#     fails the build in that case. Fix: run `uv run s1 report` and commit both files.
#
# Limitation: for pull requests from forks, GitHub runs the workflow definition from the base repo, so this
# CI only runs on PRs after this file has been merged into the base branch's main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.12" # keep in sync with .python-version

      - name: Install (core + dev group; no openjev extra)
        run: uv sync --locked

      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run ty check
      - run: uv run pytest

      - name: Results report is up to date
        run: |
          uv run s1 report
          git diff --exit-code results/
