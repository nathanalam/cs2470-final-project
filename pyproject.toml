[project]
name = "cs2470-final-project"
version = "0.1.0"
description = "s1: experiment runner for System One decision models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=0.36",
    "pyarrow>=18",
    "rich>=13.7",
    "typer>=0.12",
]

[project.optional-dependencies]
# Serving stack pinned to the versions OpenJev's serve/SERVE.md was measured with. Install on a GPU node:
#   uv sync --extra openjev
openjev = [
    "vllm==0.29.0",
    "transformers==5.17.0",
    "openai==3.16.2",
    "httpx==0.28.1",
]

[project.scripts]
s1 = "s1.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/s1"]

[dependency-groups]
dev = [
    "pytest>=8",
    "tokenizers>=0.20",  # tests build a toy tokenizer for the shape_sweep token counter
    "ruff>=0.17.0",
    "ty>=0.0.86",
]

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "C4",       # comprehensions
    "RUF",      # ruff-specific
    "PTH",      # pathlib
    "ANN",      # annotations required everywhere
    "PL",       # pylint
    "TRY",      # exception hygiene
]
ignore = [
    "PLR0913",  # CLI commands take many options
    "PLR2004",  # magic numbers
    "TRY003",   # long messages in exceptions are fine for a CLI
    "B008",     # typer.Option defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004"]

[tool.ty.environment]
python-version = "3.12"

[tool.ty.rules]
all = "error"

[tool.ty.terminal]
error-on-warning = true
